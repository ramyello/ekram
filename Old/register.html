<div class="container">
	<div class="row">
        <div id="register-form" class="col-lg-6 col-lg-offset-3">
            <div class="row">
            	<button title="Close (Esc)" type="button" class="mfp-close">أ—</button>
                
                <div class="col-lg-12" style="direction:rtl; text-align:right">
                	<h2 class="uppercase">ثبت نام</h2>
                    <p>جهت ثبت نام در کنفرانس فرم زیر را پر کنید</p>
                </div>
                <!-- REGISTER FORM -->
                <div class="register-form col-lg-12" style="direction:rtl; text-align:right">
                    <div class="control-group">
                        <div class="controls">
                            <label for="name">نام و نام خانوادگی</label><br>
                            <input type="text" name="name" id="name" required data-validation-required-message="Please enter your name" />
                        </div>
                    </div>
                
                    <div class="control-group">
                        <div class="controls ">                           
                            <label for="email">پست الکترونیک</label><br>
                            <input type="email" name="email" id="email"  required data-validation-required-message="Please enter your email" />
                        </div>
                    </div>
                
                    <div class="control-group">
                        <div class="controls ">                            
                            <label for="phone">شماره تلفن همراه</label><br>
                            <input type="text" name="phone" id="phone" required data-validation-required-message="Please enter your phone" />
                        </div>
                    </div>
                    
                     <div class="control-group">
                        <div class="controls ">                            
                            <label for="type">نوع</label><br>
                            <select name="type" id="type">
                                    <option value="" disabled selected="selected">لطفا یکی را انتخاب کنید</option>
                                    <option value="Early Bird">استاندارد</option>
                                    <option value="Standart">دانشجویی</option>
                                    <option value="Full Price">پکیج کامل</option>
                                </select>
                        </div>
                    </div>
                
                    <div class="col-lg-12 text-right">
                        <button class="button button-big button-dark" onclick="contact_send();">ارسال</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
